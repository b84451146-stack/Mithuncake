<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASHIF - ASCII AK-47</title>
<style>
html,body{margin:0;background:#0b0b10;height:100%;display:flex;align-items:center;justify-content:center}
pre{font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.05;margin:0;color:#ddd}
.g{color:#cfd3dc}.b{color:#4dd0e1}.y{color:#ffe14d}.r{color:#ff4d4d}.w{color:#fff}.o{color:#ff9f1a}
</style></head><body><pre id="s"></pre>
<script>
const W=100,H=14,GUN=["        __________________________________", " ______/____|______________________|=====|=====o==", "|_____________|  _____  |===========|__|", " \\__   ____/ |_/     \\_|_|_|_|_|_|_|_|", "    / /\\ \\    \\_____/", "   / /  \\ \\ ", "  /_/    \\_\\ "],FONT={"M": ["#   #", "## ##", "# # #", "#   #", "#   #"], "I": ["###", " # ", " # ", " # ", "###"], "T": ["#####", "  #  ", "  #  ", "  #  ", "  #  "], "H": ["#   #", "#   #", "#####", "#   #", "#   #"], "U": ["#   #", "#   #", "#   #", "#   #", " ### "], "N": ["#   #", "##  #", "# # #", "#  ##", "#   #"], "A": [" ### ", "#   #", "#####", "#   #", "#   #"], "S": [" ####", "#    ", " ### ", "    #", "#### "], "F": ["#####", "#    ", "#### ", "#    ", "#    "]},NAME="ASHIF",GX=1,GY=2,BX=64,BY=1,FIRE_EVERY=14;
const offs=[];let xo=0;for(const ch of NAME){offs.push(xo);xo+=FONT[ch][0].length+1}
let bullets=[],sparks=[],flash=0,recoil=0,tick=0,hits=0,glow=Array(NAME.length).fill(0);
const muzzleX=GX+GUN[1].length,barrelY=GY+1,pre=document.getElementById("s");
const rnd=(a,b)=>a+Math.random()*(b-a);
function fit(){pre.style.fontSize=Math.min(18,innerWidth/(W*0.62))+"px"}fit();addEventListener("resize",fit);
const esc=c=>c=="<"?"&lt;":c=="&"?"&amp;":c;
function step(){
 if(tick%FIRE_EVERY==0){flash=3;recoil=2;bullets.push([muzzleX+1,barrelY]);sparks.push([GX+22,GY,0.4,-0.5,6,","])}
 bullets=bullets.filter(b=>{b[0]+=4;if(b[0]>=BX){glow[hits%NAME.length]=10;hits++;
  for(let i=0;i<14;i++)sparks.push([BX,b[1],rnd(-1.8,0.2),rnd(-1.2,1.2),5+Math.floor(Math.random()*7),"*+.'`x"[Math.floor(Math.random()*6)]]);return false}return true});
 sparks=sparks.filter(s=>{s[0]+=s[2];s[1]+=s[3];s[3]+=0.12;s[4]--;return s[4]>0&&s[0]>=0&&s[0]<W&&s[1]>=0&&s[1]<H});
 glow=glow.map(g=>Math.max(0,g-1));
 const grid=Array.from({length:H},()=>Array.from({length:W},()=>[" ","g"]));
 const put=(x,y,c,k)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&x<W&&y>=0&&y<H&&c!=" ")grid[y][x]=[c,k]};
 const ox=GX-(recoil?1:0);
 GUN.forEach((l,r)=>[...l].forEach((c,i)=>put(ox+i,GY+r,c,"g")));
 [...NAME].forEach((ch,i)=>FONT[ch].forEach((l,r)=>[...l].forEach((p,c)=>{if(p=="#")put(BX+offs[i]+c,BY+r,glow[i]?"@":"#",glow[i]?"y":"b")})));
 if(flash){const mx=muzzleX+1,my=barrelY;[[0,0,"*"],[1,0,"*"],[2,0,"-"],[1,-1,"\\"],[1,1,"/"],[3,0,"="],[0,-1,"'"],[0,1,"."]].forEach(([dx,dy,c])=>put(mx+dx,my+dy,c,dx<2?"r":"y"))}
 bullets.forEach(b=>{put(b[0],b[1],"=","w");put(b[0]-1,b[1],"-","w")});
 sparks.forEach(s=>put(s[0],s[1],s[5],s[4]>3?"y":"o"));
 [..."- ashif -   hits: "+hits].forEach((c,i)=>put(BX+3+i,BY+7,c,"w"));
 pre.innerHTML=grid.map(row=>row.map(([c,k])=>c==" "?" ":`<span class="${k}">${esc(c)}</span>`).join("")).join("\n");
 if(flash)flash--;if(recoil)recoil--;tick++;
}
setInterval(step,50);
</script></body></html>
